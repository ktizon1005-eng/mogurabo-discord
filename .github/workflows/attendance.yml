name: 出勤確認の投稿

on:
  # 時刻はGAS（出勤確認（出勤管理マン））が守り、20時台にここを呼ぶ。
  # GitHubの定時実行（schedule）は7時間以上遅れたことがあるので使わない（2026-11-10）。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '確認だけ（投稿しない）'
        type: boolean
        default: true

concurrency:
  group: attendance-post
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - name: 投稿する
        run: node scripts/post-once.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MENTION: ${{ secrets.MENTION }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
